services:
  postgres:
    image: postgres:16-alpine
    container_name: geokurir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-geokurir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geokurir_secret}
      POSTGRES_DB: ${DB_NAME:-geokurir_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-geokurir} -d ${DB_NAME:-geokurir_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: geokurir-web
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-geokurir}
      - DB_PASSWORD=${DB_PASSWORD:-geokurir_secret}
      - DB_NAME=${DB_NAME:-geokurir_db}
      - PORT=5000
      - DEBUG=false
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GEOCODING_LIMIT=${GEOCODING_LIMIT:-None}
      - SECRET_KEY=${SECRET_KEY:-geokurir-malang-super-secret-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

  adminer:
    image: adminer:latest
    container_name: geokurir-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
